name: Publicar imagem da API

on:
  workflow_call:
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Construir e publicar imagem
    if: >-
      ${{ github.repository == 'Uninorte-Extensao/conecta-vagas'
          && github.ref == 'refs/heads/main'
          && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: docker-publish-main
      cancel-in-progress: false

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Entrar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/conecta-vagas-api:dev
            ${{ secrets.DOCKERHUB_USERNAME }}/conecta-vagas-api:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
